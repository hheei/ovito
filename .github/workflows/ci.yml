name: CI

on:
  push:
    branches: [ master, main, 'feature/**' ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64
  # ---------------------------------------------------------------------------
  build-linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential \
            libboost-dev libnetcdf-dev libhdf5-dev \
            libgl1-mesa-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtshadertools'
          set-env: true

      - name: Configure CMake
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOVITO_BUILD_CPP_TESTS=ON \
            -DOVITO_BUILD_APP=ON

      - name: Build
        run: |
          ninja -C build -j 4

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.Qt6_DIR }}/lib:${{ github.workspace }}/build/lib/ovito/plugins
        run: |
          ctest --test-dir build --output-on-failure -V

  # ---------------------------------------------------------------------------
  # Linux ARM64
  # ---------------------------------------------------------------------------
  build-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential \
            libboost-dev libnetcdf-dev libhdf5-dev \
            libgl1-mesa-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-0

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtshadertools'
          set-env: true

      - name: Configure CMake
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOVITO_BUILD_CPP_TESTS=ON

      - name: Build
        run: |
          ninja -C build -j 4

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.Qt6_DIR }}/lib:${{ github.workspace }}/build/lib/ovito/plugins
        run: |
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon ARM64)
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ninja boost netcdf hdf5

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools'
          set-env: true

      - name: Configure CMake
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DOVITO_BUILD_CPP_TESTS=ON

      - name: Build
        run: |
          ninja -C build -j 4

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows AMD64
  # ---------------------------------------------------------------------------
  build-windows-x64:
    name: Windows AMD64
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          set-env: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DOVITO_BUILD_CPP_TESTS=ON

      - name: Build
        run: |
          ninja -C build -j 4

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure
