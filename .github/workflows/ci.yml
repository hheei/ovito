name: CI

# Build and test matrix for the three supported platforms.
#
# The wall-clock cost of this workflow is the Build step: it used to be 92-95% of every job (16m47s of 19m57s on
# Windows, 28m42s of 30m57s on macOS) while CTest takes about a second and the Qt Quick smoke tests 3-25 seconds.
# This workflow is the *test* half of the pipeline and optimizes for that: it builds with -O2 instead of the -O3 of
# the release workflow (release.yml), because nothing here measures performance. Every measure below is documented
# with the measurement behind it in docs/design/UI_TEST_ENV.md section 6.1:
#
#   * a compiler cache (ccache on every platform, one cache per OS and architecture shared by all jobs of that
#     platform), which makes a rebuild of an unchanged translation unit a lookup instead of a compile. OVITO
#     compiles nearly every translation unit with a precompiled header, which ccache refuses to cache unless
#     CCACHE_SLOPPINESS names pch_defines and time_macros - without those two words 81% of the calls here were
#     uncacheable and the cache did nothing; with them a changed translation unit went from 5.9 s to 0.15 s and
#     a fully warm rebuild of the whole tree takes 0.7 s at -j4.
#   * clang on the Linux x86_64 job: measured on the full tree, clang needs 1459 s of compile work against
#     2570 s for gcc (143 s of wall time at -j16 against 233 s), because it is much faster on the Qt and Boost
#     template code. The shipped Linux binaries come from the release workflow, which uses gcc and -O3 - run that
#     workflow (a tag or a manual dispatch) before a release that touches compiler-specific code.
#   * the macOS job builds the frontend scope: its smoke test needs the spike executable, not the QtWidgets
#     application, and the spike lands in the same bundle directory either way (512 instead of 951 translation
#     units, about ten minutes less).
#   * a path filter: a change to documentation alone cannot break the build, so it does not start a 20-minute
#     matrix. Note for a repository that requires these checks before merging: a skipped workflow reports no
#     status, so a docs-only pull request would wait forever - lift the filter then.
#
# All three jobs run for every push to a monitored branch, for pull requests and for a manual dispatch.

on:
  push:
    branches: [ master, main, 'feature/**' ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'graphify-out/**'
      - '.gitignore'
      - 'LICENSE*'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'graphify-out/**'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ccache: the two sloppiness words are what make the precompiled headers cacheable at all, and depend mode makes
  # the cache key independent of the preprocessor run. The cache lives in the workspace so that actions/cache can
  # save it, and CCACHE_BASEDIR makes the entries independent of the absolute checkout path.
  CCACHE_SLOPPINESS: pch_defines,time_macros
  CCACHE_DEPEND: '1'
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: '1'
  # Selects the compiler cache of the CMake presets (ccache here, empty on a machine without one, in which case
  # CMake simply compiles directly; the top-level CMakeLists only enables ccache by itself when no launcher is
  # configured).
  OVITO_COMPILER_LAUNCHER: ccache
  # The checks every Qt Quick smoke test runs, in the order the spike expects them (see src/ovito/gui/qml/spike).
  # One list for all four platforms: the shell checks lost their per-platform duplication when they moved into
  # the spike's option table. The checks that mutate the scene or take time are last: the import check ends with a
  # cancelled import, which leaves the scene empty on purpose.
  # The check list every platform runs. The frame-rate and hide/show probes are *not* part of it: they need a window
  # that a compositor keeps mapping, and on the macOS runners the spike prints its BOOTSTRAP line and then never reaches
  # its first check when they are enabled (a real macOS host with a display runs them fine - the numbers in
  # UI_TEST_ENV.md section 9.5 come from one). The Linux and Windows jobs add them back, so the probes are covered where
  # they can run.
  QML_SMOKE_CHECKS: >-
    --qml-window-size 1280x800 --qml-startup-delay 3000 --qml-lifecycle-cycles 2
    --qml-layout-check --qml-command-check --qml-settings-check --qml-session-check --qml-library-check
    --qml-icon-check --qml-offscreen-check --qml-prewarm-check --qml-pick 300,300 --qml-parity-check
    --qml-import-check
    --qml-automation-check
    --qml-animation-check
    --qml-pipeline-check

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 - the full product: every plugin, the QtWidgets frontend and
  # the Qt Quick frontend, plus the screenshot of the workbench. Compiles with
  # clang (CMake preset "ci-linux").
  # ---------------------------------------------------------------------------
  build-linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            ninja-build build-essential ccache clang \
            libboost-dev libnetcdf-dev libhdf5-dev \
            libgl1-mesa-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers xvfb ffmpeg \
            libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtshadertools'
          cache: true
          set-env: true

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # One cache per OS and architecture, shared by every job and scope of that platform: the compile
          # commands of the libraries this frontend is built on are identical in both scopes, and ccache hashes the
          # whole command line, so a cache populated by another scope can only ever produce correct objects.
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --preset ci-linux

      - name: Build
        run: |
          cmake --build --preset ci-linux --parallel "$(nproc)"
          ccache --show-stats

      # The Python suites test the environment rules of the package contract, and the first of those rules is the
      # version envelope of PythonContract (CPython 3.10 to 3.13). The runners' default python3 is newer than that, so
      # the cases that need an interpreter inside the envelope would skip themselves and the job would go green without
      # having tested them (the same hole OVITO_REQUIRE_TEST_BINARY closes for a missing application).
      - name: Install a Python the contract supports
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib:${{ github.workspace }}/build/lib/ovito/plugins
          # This job builds the application, so the suite that drives its command line must not skip itself for want
          # of a binary (see tst_automation_cli).
          OVITO_REQUIRE_TEST_BINARY: 1
        run: |
          ctest --test-dir build --output-on-failure -V

      # The console/headless entry point of the product application, which no other step of this workflow reaches:
      # the spike links the frontend libraries directly.
      - name: Smoke test the application without a user interface
        env:
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib:${{ github.workspace }}/build/lib/ovito/plugins
        run: |
          ./build/bin/ovito --nogui

      # The shell is captured while the checks run. The spike cannot capture itself, because
      # QQuickWindow::grabWindow() is not usable with QQuickRhiItem viewports (UI_TEST_ENV.md section 3.3), so the
      # display is started here and photographed from outside with ffmpeg's x11grab. The image is uploaded as an
      # artifact rather than compared in the build: the shell checks assert model state, not pixels, and a shell
      # that rendered a single empty pane once passed every layout assertion.
      - name: Smoke test the Qt Quick frontend
        env:
          QT_QPA_PLATFORM: xcb
          QSG_RENDER_LOOP: basic
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib:${{ github.workspace }}/build/lib/ovito/plugins
        # A spike that hangs must fail the job instead of holding it until GitHub's six-hour limit - the macOS runner
        # hung here once, right after the workbench bootstrap line.
        timeout-minutes: 10
        run: |
          python3 - <<'PY'
          import os, pathlib
          a, n = 3.6, 8
          # The comment line must not contain the word "atoms" (see UI_TEST_ENV.md section 1).
          lines = [f"{n**3}", "simple cubic lattice, a=3.6"]
          lines += [f"Ar {i*a} {j*a} {k*a}" for i in range(n) for j in range(n) for k in range(n)]
          pathlib.Path(os.environ["RUNNER_TEMP"], "lattice_512.xyz").write_text("\n".join(lines) + "\n")
          PY
          Xvfb :77 -screen 0 1400x900x24 &
          XvfbPid=$!
          export DISPLAY=:77
          # QML_SMOKE_CHECKS holds the check list as separate arguments, which is what shellcheck warns about.
          # shellcheck disable=SC2086
          build/bin/ovito-qml-spike --qml-frame-stats 2000 --qml-hide-show $QML_SMOKE_CHECKS "$RUNNER_TEMP/lattice_512.xyz" > spike.log 2>&1 || status=$?
          cat spike.log
          # Photograph a run that leaves a scene loaded. The checks above end with a cancelled import, which leaves the
          # scene empty on purpose - a capture taken there shows the shell's empty state instead of a rendered viewport,
          # which is not what this image is for.
          build/bin/ovito-qml-spike \
              --qml-window-size 1280x800 \
              --qml-startup-delay 3000 \
              --qml-layout-check \
              --qml-command-check \
              --qml-pick 300,300 \
              --qml-hold-ms 8000 \
              "$RUNNER_TEMP/lattice_512.xyz" > capture.log 2>&1 &
          CapturePid=$!
          for _ in $(seq 1 300); do
            grep -q VERIFICATION_DONE capture.log && break
            kill -0 $CapturePid 2>/dev/null || break
            sleep 1
          done
          sleep 1
          ffmpeg -loglevel error -f x11grab -video_size 1400x900 -i :77 -frames:v 1 -y shell.png || true
          wait $CapturePid || true
          cat capture.log
          kill "$XvfbPid" 2>/dev/null || true
          exit "${status:-0}"

      - name: Upload the workbench screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qt-quick-shell-linux-x86_64
          path: shell.png
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS (Apple Silicon ARM64) - the Qt Quick frontend. Qt (both the scene graph
  # and OVITO's offscreen picking) uses Metal here, which the runner provides
  # without a physical display. The job builds the frontend scope, which is what
  # its smoke test needs: the spike lives in the same Ovito.app/Contents/MacOS
  # directory in either scope, while building the QtWidgets application on a
  # three-core runner costs another ten minutes.
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ninja boost netcdf hdf5 ccache

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools'
          cache: true
          set-env: true

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # One cache per OS and architecture, shared by every job and scope of that platform: the compile
          # commands of the libraries this frontend is built on are identical in both scopes, and ccache hashes the
          # whole command line, so a cache populated by another scope can only ever produce correct objects.
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --preset ci-macos -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: |
          cmake --build --preset ci-macos --parallel "$(sysctl -n hw.ncpu)"
          ccache --show-stats

      - name: Install a Python the contract supports
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
          # This job builds the application, so the suite that drives its command line must not skip itself for want
          # of a binary (see tst_automation_cli).
          OVITO_REQUIRE_TEST_BINARY: 1
        run: |
          ctest --test-dir build --output-on-failure

      - name: Smoke test the Qt Quick frontend
        timeout-minutes: 10
        run: |
          python3 - <<'PY'
          import os, pathlib
          a, n = 3.6, 8
          # The comment line must not contain the word "atoms" (see UI_TEST_ENV.md section 1).
          lines = [f"{n**3}", "simple cubic lattice, a=3.6"]
          lines += [f"Ar {i*a} {j*a} {k*a}" for i in range(n) for j in range(n) for k in range(n)]
          pathlib.Path(os.environ["RUNNER_TEMP"], "lattice_512.xyz").write_text("\n".join(lines) + "\n")
          PY
          # The application finds Qt through the rpath it was linked with. install-qt-action exports
          # DYLD_LIBRARY_PATH pointing at the Qt installation's lib directory, and on macOS that makes this frontend
          # hang right after its bootstrap line: three runs stopped there (36682114351, 36686187926, 36691537242),
          # and the value only became effective when the variable was renamed from the Qt6_DIR that the action does
          # not export on macOS to QT_ROOT_DIR. The variable is therefore dropped on purpose, and a hang is sampled
          # instead of only reported as a timeout (see UI_TEST_ENV.md 9.2.13).
          unset DYLD_LIBRARY_PATH
          # QML_SMOKE_CHECKS holds the check list as separate arguments, which is what shellcheck warns about.
          # shellcheck disable=SC2086
          build/Ovito.app/Contents/MacOS/ovito-qml-spike $QML_SMOKE_CHECKS "$RUNNER_TEMP/lattice_512.xyz" > spike.log 2>&1 &
          SpikePid=$!
          Hung=1
          for _ in $(seq 1 90); do
            kill -0 "$SpikePid" 2>/dev/null || { Hung=0; break; }
            sleep 5
          done
          if [[ $Hung == 1 ]]; then
            echo "SPIKE_HUNG: the frontend made no progress for 450 s; sampling the process."
            sample "$SpikePid" 3 -file spike.sample.txt || true
            head -150 spike.sample.txt || true
            kill -9 "$SpikePid" || true
            cat spike.log || true
            exit 1
          fi
          wait "$SpikePid" || status=$?
          cat spike.log
          exit "${status:-0}"

  # ---------------------------------------------------------------------------
  # Windows AMD64 - the full product, with ccache.
  # ---------------------------------------------------------------------------
  build-windows-x64:
    name: Windows AMD64
    runs-on: windows-2022
    env:
      # ccache on every platform. It is the only one of the two that can cache a translation unit which *consumes*
      # an MSVC precompiled header (sccache reports "MSVC Precompiled header flags not supported"), and a command it
      # cannot handle is simply not cached - never miscompiled.
      OVITO_COMPILER_LAUNCHER: ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # The precompiled headers stay enabled here. OVITO's sources need them to compile at all (measured on
      # Linux: with OVITO_USE_PRECOMPILED_HEADERS=OFF the translation units that include TaskProgress.h fail on an
      # incomplete UserInterface type), so disabling them is not a way to make the Windows cache work. ccache
      # caches the translation units that consume the headers; it cannot cache their generation, which costs one
      # compile per target and nothing else.
      - name: Install the compiler cache
        continue-on-error: true
        shell: pwsh
        run: |
          # Not fatal: without a launcher the build simply compiles everything.
          choco install ccache --no-progress -y

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      # The runner image provides neither Boost (geogram) nor HDF5/NetCDF-C (the Particles plugin's
      # netcdf_integration module) outside of the bundled release packages, so they come from vcpkg.
      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: vcpkg-x64-windows-boost-hdf5-netcdf-v1

      - name: Restore the Boost headers from the cache
        id: boost-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.boost
          key: boost-1.92.0-headers

      - name: Install the Boost headers
        if: steps.boost-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # vcpkg's boost-headers port only carries the headers that do not belong to a library-specific
          # port, so the complete official Boost headers are used instead: OVITO includes headers such as
          # boost/algorithm/algorithm.hpp and boost/version.hpp, which are otherwise missing.
          $version = "1.92.0"
          $underscored = $version -replace '\.', '_'
          Invoke-WebRequest "https://archives.boost.io/release/$version/source/boost_$underscored.tar.gz" -OutFile "$env:RUNNER_TEMP/boost.tar.gz"
          New-Item -ItemType Directory -Force "${{ github.workspace }}\.boost" | Out-Null
          tar -xzf "$env:RUNNER_TEMP/boost.tar.gz" -C "${{ github.workspace }}\.boost" --strip-components=1

      - name: Install the HDF5/NetCDF/SQLite3 libraries
        shell: pwsh
        run: |
          # netcdf-c[netcdf-4] pulls the HDF5 high-level library it needs. Naming "core" first disables its
          # default features dap and nczarr, which would otherwise build curl for remote access OVITO
          # does not use.
          # Same third-party libraries the Linux and macOS jobs get from their package managers: HDF5 with
          # its high-level library and NetCDF-C for the particle file formats, and SQLite3 for the particles
          # plugin (Boost is installed separately, see above).
          vcpkg install "hdf5[hl]:x64-windows" "netcdf-c[core,netcdf-4]:x64-windows" sqlite3:x64-windows
          # vcpkg installs into the vcpkg root, which is a machine-level environment variable of the runner image
          # and therefore not part of the Actions env context. Export the path explicitly for the later steps.
          $root = if($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          "VCPKG_TOOLCHAIN=$root/scripts/buildsystems/vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Report the vcpkg runtime layout (diagnostic)
        shell: pwsh
        run: |
          $root = if($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          Get-ChildItem "$root/installed/x64-windows/bin" -Filter "*.dll" | Select-Object -ExpandProperty Name

      # Qt pre-compiles the HLSL shaders to DXIL with dxc, which must be on the PATH - and whose absence is a
      # fatal error at configure time (see src/ovito/core/CMakeLists.txt).
      - name: Install the DirectX shader compiler (dxc)
        shell: pwsh
        run: |
          $dxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter dxc.exe -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.DirectoryName -like "*\x64" } | Select-Object -Last 1
          if(-not $dxc) {
            nuget install Microsoft.Direct3D.DXC -OutputDirectory C:\dxc
            $dxc = Get-ChildItem C:\dxc -Filter dxc.exe -Recurse | Select-Object -First 1
          }
          if(-not $dxc) { throw "dxc.exe not found" }
          Write-Host "Using $($dxc.FullName)"
          $dxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'
          cache: true
          set-env: true

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake --preset ci-windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_TOOLCHAIN" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DBOOST_ROOT="${{ github.workspace }}\.boost" -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset ci-windows --parallel $env:NUMBER_OF_PROCESSORS
          # PowerShell decides the step's outcome by the exit code of its last statement, so the ccache report below
          # would swallow a failed build: the run that failed to link tst_python_data_bridge reported a successful
          # Build step and only showed the linker error as a mysterious CTest failure.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --show-stats }

      - name: Install a Python the contract supports
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test (CTest)
        env:
          QT_QPA_PLATFORM: offscreen
          # This job builds the application, so the suite that drives its command line must not skip itself for want
          # of a binary (see tst_automation_cli).
          OVITO_REQUIRE_TEST_BINARY: 1
        shell: pwsh
        run: |
          # On Windows every OVITO library - Core, Gui and the plugin DLLs - is placed directly in the build
          # directory, not in a lib\ovito\plugins subdirectory: Windows would not find Core where the plugins live
          # (see OVITO_RELATIVE_PLUGINS_DIRECTORY and cmake/Plugins.cmake). The test executables link Core, and Core
          # loads the runtime libraries of its dependencies, which are the ones vcpkg deployed into its tree.
          # Composing the variable in the shell also keeps the runner's PATH: the Actions env context cannot expand
          # the runner's PATH variable, so "${{ env.PATH }}" is empty and would replace PATH with the build directory
          # alone. Pointing at the plugin subdirectory instead of the build directory made every test abort with
          # 0xc0000135 (STATUS_DLL_NOT_FOUND) while the header-only tst_containers passed.
          $vcpkg = if($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $env:PATH = "${{ github.workspace }}\build;$vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Smoke test the application without a user interface
        shell: pwsh
        run: |
          $vcpkg = if($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          $env:PATH = "${{ github.workspace }}\build;$vcpkg\installed\x64-windows\bin;$env:PATH"
          # ovito.exe is linked as a Windows-subsystem application (src/main/CMakeLists.txt sets WIN32_EXECUTABLE), so
          # PowerShell neither waits for it nor sets $LASTEXITCODE - the first version of this step threw an exception
          # with an empty exit code while OVITO had actually started fine. Start-Process gives a real exit code, and
          # QT_FORCE_STDERR_LOGGING makes any diagnostic reach the redirected files instead of the debugger.
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $process = Start-Process -FilePath "${{ github.workspace }}\build\ovito.exe" -ArgumentList '--nogui' `
                                   -Wait -PassThru `
                                   -RedirectStandardOutput "$env:RUNNER_TEMP\ovito-nogui.out" `
                                   -RedirectStandardError "$env:RUNNER_TEMP\ovito-nogui.err"
          Get-Content "$env:RUNNER_TEMP\ovito-nogui.out", "$env:RUNNER_TEMP\ovito-nogui.err" -ErrorAction SilentlyContinue
          if($process.ExitCode -ne 0) { throw "ovito --nogui failed with exit code $($process.ExitCode)" }

      # The runners have no GPU, but Direct3D 12 is available through the WARP software adapter, which the Qt
      # Quick scene graph uses when QSG_RHI_PREFER_SOFTWARE_RENDERER is set. OVITO's own offscreen picking
      # RenderThread also prefers D3D12 and falls back to D3D11, both of which WARP provides. This is the only
      # D3D12 validation of the Qt Quick frontend that is possible without Windows hardware.
      - name: Smoke test the Qt Quick frontend (Direct3D 12 via WARP)
        shell: pwsh
        timeout-minutes: 15
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
          # Qt writes its messages to the debugger instead of to a redirected stderr on Windows, which is why the step
          # below - and the earlier runs of this job - showed no output at all. Force the messages to stderr so the
          # failing checks of the spike appear in the log.
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          # OVITO's build tree contains a qt.conf that points at a plugins/ directory - the layout of an installed
          # package. Qt's own plugins and its QML modules therefore have to be pointed at explicitly, or the
          # "windows" platform plugin and the QtQuick.Controls module cannot be found (UI_TEST_ENV.md 5.5).
          # The prefix comes from QT_ROOT_DIR, which install-qt-action exports: Qt6_DIR is the variable it only sets for
          # CMake (and which is empty in a step that reads it as an environment variable).
          # QSG_RHI_BACKEND is deliberately not set: the frontend selects Direct3D 12 itself on Windows, and this
          # step is the regression check for that.
          $qtPrefix = $env:QT_ROOT_DIR
          if(-not (Test-Path "$qtPrefix\plugins")) {
            throw "Qt not found: QT_ROOT_DIR is '$qtPrefix'"
          }
          $env:QT_PLUGIN_PATH = "$qtPrefix\plugins"
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$qtPrefix\plugins\platforms"
          $env:QML_IMPORT_PATH = "$qtPrefix\qml"
          $env:QML2_IMPORT_PATH = "$qtPrefix\qml"
          $vcpkg = if($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }

          $dataset = Join-Path $env:RUNNER_TEMP "lattice_512.xyz"
          # The comment line must not contain the word "atoms" (see the Linux jobs above).
          $lines = @("512", "simple cubic lattice, a=3.6")
          foreach($i in 0..7) { foreach($j in 0..7) { foreach($k in 0..7) {
            $lines += "Ar $($i*3.6) $($j*3.6) $($k*3.6)" } } }
          $lines | Out-File -FilePath $dataset -Encoding ascii

          $env:PATH = "${{ github.workspace }}\build;$vcpkg\installed\x64-windows\bin;$env:PATH"
          # The output is captured through files: the failing checks of the spike are what a red job has to show, and on
          # Windows the diagnostics of the Qt process did not reach the log of the step at all (the step ran a full 37
          # seconds and printed nothing while the spike exited with code 1).
          $spikeOutput = Join-Path $env:RUNNER_TEMP "spike-output.log"
          $spikeError = Join-Path $env:RUNNER_TEMP "spike-error.log"
          # QML_SMOKE_CHECKS holds the shared check list, which is split into an argument array here; the frame-rate
          # probe is added per job because the macOS runners cannot run it (see the variable's definition above).
          $spikeArgs = @($env:QML_SMOKE_CHECKS -split '\s+') + @('--qml-frame-stats', '2000') + $dataset
          $spike = Start-Process -FilePath "${{ github.workspace }}\build\ovito-qml-spike.exe" `
              -ArgumentList $spikeArgs -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput $spikeOutput -RedirectStandardError $spikeError
          Write-Host "--- output of the spike ---"
          Get-Content $spikeOutput, $spikeError -ErrorAction SilentlyContinue
          if((-not (Test-Path $spikeOutput) -or (Get-Item $spikeOutput).Length -eq 0) -and
             (-not (Test-Path $spikeError) -or (Get-Item $spikeError).Length -eq 0)) {
            Write-Host "The spike produced no output at all - see QT_FORCE_STDERR_LOGGING in the environment of this step"
          }
          if($spike.ExitCode -ne 0) {
            throw "The Qt Quick smoke test failed with exit code $($spike.ExitCode)"
          }
